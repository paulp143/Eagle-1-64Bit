name: Feature Request
description: Suggest an idea or enhancement for Eagle-1
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of what you would like to see added.
    validations:
      required: true
  - type: textarea
    id: problem-or-use-case
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or gameplay mechanic?
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution or Implementation Concept
      description: How should this work in the game?
