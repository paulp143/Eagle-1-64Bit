name: Bug Report
description: Create a report to help us fix an issue or defect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!

        **Security Notice:** If you believe you have discovered a security vulnerability, please do NOT file a public issue. Follow our [Security Policy](../../.github/SECURITY.md) to report it privately.
  - type: textarea
    id: problem-description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this issue?
      placeholder: |
        1. Launch game
        2. Select mission...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, pygame / pygame-ce version.
      placeholder: Windows 11, Python 3.12, pygame-ce 2.5.2
