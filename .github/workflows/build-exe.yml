name: Build Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows Standalone Binary
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "Eagle-1" `
            --add-data "images;images" `
            --add-data "audio;audio" `
            --add-data "data;data" `
            run_game.py

      - name: Archive Distribution Directory
        shell: powershell
        run: |
          Compress-Archive -Path dist\Eagle-1 -DestinationPath dist\Eagle-1-Windows.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Eagle-1-Windows
          path: dist/Eagle-1-Windows.zip
          retention-days: 14

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Eagle-1-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
